services:
  - type: web
    name: winddesk-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 backend.app.main:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: WIND_DATA_DIR
        value: backend/data
      - key: CORS_ORIGINS
        value: "*"
